default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Keep large payload jobs serial by default. No wildcard worker may also
    # claim these queues, or it would bypass this resource budget.
    - queues: [ imports, backups ]
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues: [ maintenance, default, mailers, solid_queue_recurring ]
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
