#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

development:
  dispatch_due_backup_schedules:
    class: Platform::Backup::DispatchDueSchedulesJob
    queue: maintenance
    schedule: every minute
  reconcile_backup_archive_retention:
    class: Platform::Backup::ReconcileArchivesJob
    queue: maintenance
    schedule: every hour at minute 27

production:
  reconcile_pending_operation_dispatches:
    class: Platform::Operations::ReconcileDispatchesJob
    queue: maintenance
    schedule: every minute
  expire_staged_operation_drafts:
    class: Platform::Operations::ExpireDraftsJob
    queue: maintenance
    schedule: every 10 minutes
  dispatch_due_backup_schedules:
    class: Platform::Backup::DispatchDueSchedulesJob
    queue: maintenance
    schedule: every minute
  reconcile_backup_archive_retention:
    class: Platform::Backup::ReconcileArchivesJob
    queue: maintenance
    schedule: every hour at minute 27
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
