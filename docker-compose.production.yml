x-app: &app
  image: ${EXPENSE_TRACKER_IMAGE:-ghcr.io/taimoorq/expense_tracker:latest}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &app-environment
    RAILS_ENV: ${RAILS_ENV:-production}
    RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
    RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    DATABASE_URL: ${DATABASE_URL}
    EXPENSE_TRACKER_DATABASE_HOST: db
    EXPENSE_TRACKER_DATABASE_PORT: 5432
    EXPENSE_TRACKER_DATABASE_USERNAME: ${POSTGRES_USER}
    EXPENSE_TRACKER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    APP_HOST: ${APP_HOST}
    APP_PROTOCOL: ${APP_PROTOCOL:-https}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    ASSUME_SSL: ${ASSUME_SSL:-true}
    FORCE_SSL: ${FORCE_SSL:-true}
    BACKUP_STORAGE_DRIVER: ${BACKUP_STORAGE_DRIVER:-disabled}
    BACKUP_LOCAL_ROOT: ${BACKUP_LOCAL_ROOT:-/rails/backups}
    BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-finance-tracking/backups}
    BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
    BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
    BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-false}
    BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    BACKUP_ENCRYPTION_KEY_ID: ${BACKUP_ENCRYPTION_KEY_ID:-primary}
    BACKUP_ENCRYPTION_PREVIOUS_KEYS: ${BACKUP_ENCRYPTION_PREVIOUS_KEYS:-}
  volumes:
    - app_storage:/rails/storage
    - ${BACKUP_HOST_PATH:-./backups}:/rails/backups

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *app
    depends_on:
      web:
        condition: service_healthy
    command: bin/jobs start

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_HOST: ${APP_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_production_data:
  app_storage:
  caddy_data:
  caddy_config:
